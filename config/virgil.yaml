# Virgil -- production config for Fly.io deployment
# Data lives at /data (Fly volume). Secrets come from Fly environment.
# Copy this file to /data/virgil.yaml and customize credentials_path values.

guide:
  name: "Virgil"
  data_dir: /data

ai:
  default: anthropic
  providers:
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
      models:
        sonnet: claude-sonnet-4-6
        haiku: claude-haiku-4-5-20251001
        opus: claude-opus-4-6
    openai:
      api_key_env: OPENAI_API_KEY
      models:
        gpt4o: gpt-4o
        gpt4o-mini: gpt-4o-mini
      embedding_model: text-embedding-3-small
  interactive:
    model: anthropic/sonnet
    fallback: [openai/gpt4o]
  mcp:
    model: anthropic/haiku
    fallback: [anthropic/sonnet]

channels:
  telegram:
    bot_token_env: VIRGIL_TELEGRAM_BOT_TOKEN
    chat_id_env: VIRGIL_TELEGRAM_CHAT_ID

  email:
    accounts:
      personal:
        provider: gmail
        address: "barnett.justin.p@gmail.com"
        credentials_path: /data/google-token-personal.json
        default: true
      keep:
        provider: gmail
        address: "justin@keep.church"
        credentials_path: /data/google-token-keep.json
        bridge: keep
      enver:
        provider: gmail
        address: "justin@enver.ai"
        credentials_path: /data/google-token-enver.json
        bridge: enver
      passion:
        provider: gmail
        address: "justin.barnett@268generation.com"
        credentials_path: /data/google-token-passion.json
        bridge: passion

  calendar:
    accounts:
      personal:
        provider: google
        address: "barnett.justin.p@gmail.com"
        credentials_path: /data/google-token-personal.json
        default: true
      passion:
        provider: google
        address: "justin.barnett@268generation.com"
        credentials_path: /data/google-token-passion.json
        bridge: passion

  slack:
    workspaces:
      passion:
        token_env: VIRGIL_SLACK_TOKEN_PASSION
        user_id: ""
        watch_channels: []
        bridge: passion
      enver:
        token_env: VIRGIL_SLACK_TOKEN_ENVER
        user_id: ""
        watch_channels: []
        bridge: enver

  jira:
    instances:
      passion:
        base_url: https://passion.atlassian.net
        email: "justin.barnett@268generation.com"
        api_token_env: VIRGIL_JIRA_TOKEN_PASSION
        bridge: passion

  drive:
    accounts: [personal, enver, passion]

  omi:
    api_key_env: OMI_API_KEY

skills:
  dir: /etc/virgil/skills/

trust:
  auto_approve_threshold: 15

server:
  host: 0.0.0.0
  port: 8080
