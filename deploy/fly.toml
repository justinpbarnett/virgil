app = "virgil-justin"
primary_region = "atl"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  VIRGIL_CONFIG = "/data/virgil.yaml"
  VIRGIL_DATA = "/data"

[mounts]
  source = "virgil_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "GET"
    path = "/health"
    timeout = "2s"
